[project]
name = "branthebuilder"
dynamic = ["version"]
description = "Python package scaffolding and CI boilerplate"
authors = [{name = "Endre Márk Borza", email = "endremborza@gmail.com"}]
license = {file = "LICENSE"}
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["protocli>=0.3.0"]

[project.urls]
Homepage = "https://github.com/endremborza/branthebuilder"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "branthebuilder/__init__.py"

[tool.ruff]
extend-exclude = ["branthebuilder/template"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
addopts = "--ignore=branthebuilder/template"

[project.scripts]
branb = "branthebuilder.main:cli"
